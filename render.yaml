# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Keep the existing PostgreSQL instance: this Blueprint creates no database.
services:
  - type: web
    name: thrift-store-admin
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./admin/Dockerfile
    dockerContext: ./admin
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - admin/**
        - render.yaml
    disk:
      name: thrift-store-admin-data
      mountPath: /app/wwwroot/app_data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: DatabaseInitialization__Enabled
        value: "false"
      - key: IsDemoVersion
        value: "false"
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        sync: false
      - key: Jwt__Audience
        sync: false
      - key: AspNetIdentity__DefaultAdmin__Email
        sync: false
      - key: AspNetIdentity__DefaultAdmin__PostCode
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      # Store app that hosts the staff panel (/painel): reset-password links and the API's "/" point here.
      - key: STORE_URL
        value: https://thrift-store-web.onrender.com

  - type: web
    name: thrift-store-web
    # Loja nova (Next.js) com o painel da equipe em /painel. A loja Razor antiga continua em web/, fora do deploy.
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./storefront/Dockerfile
    dockerContext: ./storefront
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - storefront/**
        - render.yaml
    # Mantido do serviço anterior para não apagar dados; a loja nova não grava em disco.
    disk:
      name: thrift-store-web-data
      mountPath: /app/App_Data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      # Mesmo valor de antes: URL pública HTTPS da API (admin), terminada em /.
      - key: ThriftStoreApi__BaseUrl
        sync: false
      # Assina os cookies de login da loja e do painel.
      - key: SESSION_SECRET
        generateValue: true
